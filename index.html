<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpeedUp - Quiz Automation & Dynamic AnswerMap</title>
  <style>
    :root {
      --bg-dark: #0b0f19;
      --panel-bg: #111827;
      --card-bg: #1f2937;
      --input-bg: #111827;
      --border-color: #374151;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #f59e0b;
      --accent-hover: #d97706;
      --danger: #ef4444;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --code-color: #a78bfa;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      padding: 24px;
    }

    .container { max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
    
    header {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    .brand { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      background: linear-gradient(135deg, var(--primary), var(--accent));
      color: #ffffff;
      font-weight: 900;
      font-size: 14px;
      padding: 6px 10px;
      border-radius: 6px;
      letter-spacing: 1px;
    }
    h1 { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    
    input, textarea {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 13px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus, textarea:focus { 
      border-color: var(--primary); 
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.25);
      outline: none; 
    }

    .grid-ctrl-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .grid-actions {
      display: flex;
      gap: 6px;
    }

    .mini-btn {
      background: #374151;
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 4px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.15s ease;
    }
    .mini-btn:hover { color: var(--text-main); background: #4b5563; }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(36px, 1fr));
      gap: 6px;
      max-height: 140px;
      overflow-y: auto;
      background: var(--input-bg);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
    }
    .cal-btn {
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #374151;
      border: 1px solid #4b5563;
      color: #9ca3af;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 700;
      font-size: 12px;
      transition: all 0.15s ease;
      user-select: none;
    }
    .cal-btn:hover { border-color: var(--primary); color: #fff; }
    .cal-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 10px rgba(139, 92, 246, 0.45);
    }

    .btn-row { display: flex; gap: 10px; }
    button.action-btn {
      background: linear-gradient(135deg, var(--primary), var(--primary-hover));
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: filter 0.2s, transform 0.1s;
    }
    button.action-btn:hover { filter: brightness(1.1); }
    button.action-btn:active { transform: scale(0.98); }

    button.copy-btn {
      background: #374151;
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    button.copy-btn:hover { background: var(--accent); color: #111827; }
    button.copy-btn.copied {
      background: var(--primary);
      border-color: var(--primary);
      color: #ffffff;
    }

    button.secondary-btn {
      background: #374151;
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }
    button.secondary-btn:hover { background: #4b5563; }

    .output-area {
      background-color: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      color: var(--code-color);
      white-space: pre-wrap;
      max-height: 180px;
      overflow-y: auto;
      line-height: 1.4;
    }

    .table-container {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; background: var(--input-bg); }
    th, td { padding: 10px 14px; text-align: left; border-bottom: 1px solid var(--border-color); vertical-align: top; }
    th { background: #111827; color: var(--text-muted); font-size: 12px; text-transform: uppercase; }
    .opt-list { margin: 4px 0 0 16px; color: var(--text-muted); font-size: 12px; }

    /* Modal Popup */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.85);
      backdrop-filter: blur(4px);
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    .modal-box {
      width: 90%;
      max-width: 720px;
      background: #111827;
      border: 2px solid var(--primary);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(139, 92, 246, 0.25);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-header h3 { color: var(--primary); font-size: 16px; }
    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 20px;
      cursor: pointer;
    }
    .modal-close:hover { color: #fff; }
    .modal-body textarea {
      width: 100%;
      height: 300px;
      background: #0b0f19;
      border: 1px solid #374151;
      color: var(--code-color);
      font-family: monospace;
      font-size: 12px;
      line-height: 1.4;
      border-radius: 6px;
      padding: 12px;
      resize: vertical;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand">
      <div class="brand-logo">SPEEDUP</div>
      <h1>Automation & Local Storage Console</h1>
    </div>
    <span id="db-status" style="font-size: 12px; color: var(--primary); font-weight: 600;">● SpeedUp IndexedDB Active</span>
  </header>

  <div class="grid-2">
    <!-- PART 1: EXTRACTOR GENERATOR -->
    <div class="card">
      <div class="card-title">
        <span>Part 1: SpeedUp Question Scraper</span>
        <div style="display: flex; gap: 6px;">
          <button class="copy-btn" onclick="openScreenModal('p1-script-output', 'Generated Scraper Script')">View on Screen</button>
          <button class="copy-btn" id="p1-copy-btn" onclick="copyScript('p1-script-output', 'p1-copy-btn')">Copy Script</button>
        </div>
      </div>
      
      <div class="form-group">
        <label>Total Questions</label>
        <input type="number" id="p1-total-q" value="30" min="1" max="100" />
      </div>

      <div class="form-group">
        <label>Read Delay (ms)</label>
        <input type="number" id="p1-speed" value="700" min="200" step="50" />
      </div>

      <div class="btn-row">
        <button class="action-btn" onclick="generatePart1Script(); openScreenModal('p1-script-output', 'Generated Scraper Script');">Generate & Show on Screen</button>
      </div>

      <div class="form-group">
        <label>Generated Scraper Script</label>
        <div class="output-area" id="p1-script-output"></div>
      </div>

      <div class="form-group">
        <label>Paste Question Text (Paragraphs to Local DB)</label>
        <textarea id="p1-import-paragraph" rows="4" placeholder="Question 1:
In how many years will sum of Rs 4000 yield an interest of Rs.1080/- at 9% p.a?

Options:
  1. 1 Year
  2. 3 Year
  3. 4 Year
  4. 2 Year
----------------------------------------"></textarea>
      </div>
      <button class="action-btn secondary-btn" onclick="saveParagraphToIndexedDB()">Save Paragraph to IndexedDB</button>
    </div>

    <!-- PART 2: INJECTOR GENERATOR -->
    <div class="card">
      <div class="card-title">
        <span>Part 2: SpeedUp Target Injector</span>
        <div style="display: flex; gap: 6px;">
          <button class="copy-btn" onclick="openScreenModal('p2-script-output', 'Generated Injector Script')">View on Screen</button>
          <button class="copy-btn" id="p2-copy-btn" onclick="copyScript('p2-script-output', 'p2-copy-btn')">Copy Script</button>
        </div>
      </div>
      
      <div class="form-group">
        <label>Total Questions</label>
        <input type="number" id="p2-total-q" value="30" min="1" max="100" onchange="renderCalendarGrid()" />
      </div>

      <div class="form-group">
        <label>Click Delay (ms)</label>
        <input type="number" id="p2-speed" value="50000" min="100" step="500" />
      </div>

      <div class="form-group">
        <label>Target Question Array (Syncs with Grid)</label>
        <input type="text" id="p2-target-input" value="[1, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 15, 16, 17, 18, 19, 20, 22, 23]" oninput="syncGridFromInput()" placeholder="[1, 3, 4, 5, 6...]" />
      </div>

      <div class="form-group">
        <div class="grid-ctrl-row">
          <label>Target Filter (CSS Grid Selection)</label>
          <div class="grid-actions">
            <button class="mini-btn" onclick="autoSelectPreset('answers')">Target from Answers</button>
            <button class="mini-btn" onclick="autoSelectAllGrid(true)">All</button>
            <button class="mini-btn" onclick="autoSelectAllGrid(false)">Clear</button>
          </div>
        </div>
        <div class="cal-grid" id="p2-cal-grid"></div>
      </div>

      <div class="form-group">
        <label>Answer Input (Map format or [Array])</label>
        <textarea id="p2-answers" rows="4" oninput="handleAnswerInput()" placeholder="Paste Map or Array:
[1, 4], [3, 3], [4, 4], [5, 2], [6, 1]...
OR: [4, 3, 4, 2, 1...]">[1, 4], [3, 3], [4, 4], [5, 2], [6, 1],
[7, 4], [8, 1], [9, 4], [10, 3], [12, 2],
[14, 2], [15, 4], [16, 3], [17, 1], [18, 2],
[19, 1], [20, 1], [22, 1], [23, 1]</textarea>
      </div>

      <div class="btn-row">
        <button class="action-btn" onclick="generatePart2Script(); openScreenModal('p2-script-output', 'Generated Injector Script');">Generate & Show on Screen</button>
      </div>

      <div class="form-group">
        <label>Generated Injector Script (answerMap Format)</label>
        <div class="output-area" id="p2-script-output"></div>
      </div>
    </div>
  </div>

  <!-- STORED QUESTIONS DATA TABLE -->
  <div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <div class="card-title" style="border: none; padding: 0;">SpeedUp Stored Database</div>
      <div style="display: flex; gap: 8px;">
        <button class="action-btn secondary-btn" style="padding: 6px 12px; font-size: 12px; color: var(--danger); border-color: var(--danger);" onclick="clearAllRecords()">Clear All</button>
        <button class="action-btn secondary-btn" style="padding: 6px 12px; font-size: 12px;" onclick="loadStoredQuestions()">Refresh Table</button>
      </div>
    </div>
    <div class="table-container">
      <table id="records-table">
        <thead>
          <tr>
            <th style="width: 70px;">#</th>
            <th>Question Body</th>
            <th>Options</th>
            <th style="width: 80px;">Action</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No records loaded.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- ONSCREEN MODAL POPUP -->
<div class="modal-backdrop" id="screen-modal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">Generated Script</h3>
      <button class="modal-close" onclick="closeScreenModal()">✕</button>
    </div>
    <div class="modal-body">
      <textarea id="modal-content" readonly></textarea>
    </div>
    <div class="modal-footer">
      <button class="action-btn secondary-btn" onclick="closeScreenModal()">Close</button>
      <button class="action-btn" id="modal-copy-btn" onclick="copyModalContent()">Copy to Clipboard</button>
    </div>
  </div>
</div>

<script>
  const DB_NAME = "SpeedUp_QuizDB";
  const DB_VERSION = 1;
  const STORE_NAME = "questions";
  let db;

  function initDB() {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const dbInstance = e.target.result;
      if (!dbInstance.objectStoreNames.contains(STORE_NAME)) {
        dbInstance.createObjectStore(STORE_NAME, { keyPath: "questionNumber" });
      }
    };
    req.onsuccess = (e) => {
      db = e.target.result;
      loadStoredQuestions();
    };
    req.onerror = () => {
      document.getElementById('db-status').textContent = '● IndexedDB Error';
      document.getElementById('db-status').style.color = 'var(--danger)';
    };
  }

  async function safeCopyToClipboard(text) {
    if (!text) return false;
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (err) {}
    }

    try {
      const tempArea = document.createElement("textarea");
      tempArea.value = text;
      tempArea.style.position = "fixed";
      tempArea.style.top = "-9999px";
      tempArea.style.left = "-9999px";
      tempArea.setAttribute("readonly", "");
      document.body.appendChild(tempArea);
      tempArea.focus();
      tempArea.select();
      
      const success = document.execCommand("copy");
      document.body.removeChild(tempArea);
      return success;
    } catch (e) {
      return false;
    }
  }

  function openScreenModal(sourceElementId, title) {
    const content = document.getElementById(sourceElementId).textContent;
    document.getElementById('modal-title').textContent = title;
    document.getElementById('modal-content').value = content;
    document.getElementById('screen-modal').style.display = 'flex';
  }

  function closeScreenModal() {
    document.getElementById('screen-modal').style.display = 'none';
  }

  async function copyModalContent() {
    const textarea = document.getElementById('modal-content');
    const success = await safeCopyToClipboard(textarea.value);
    
    if (success) {
      const btn = document.getElementById('modal-copy-btn');
      const originalText = btn.innerText;
      btn.innerText = '✓ Copied to Clipboard!';
      setTimeout(() => { btn.innerText = originalText; }, 2000);
    } else {
      textarea.select();
      alert("Press Ctrl+C (or Cmd+C) to copy.");
    }
  }

  async function copyScript(elementId, btnId) {
    const code = document.getElementById(elementId).textContent;
    const success = await safeCopyToClipboard(code);
    const btn = document.getElementById(btnId);

    if (success) {
      const originalText = btn.innerText;
      btn.innerText = '✓ Copied!';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.innerText = originalText;
        btn.classList.remove('copied');
      }, 2000);
    } else {
      openScreenModal(elementId, 'Copy Script');
    }
  }

  function parseParagraphText(text) {
    const blocks = text.split(/-{3,}/).map(b => b.trim()).filter(b => b.length > 0);
    const parsedData = [];

    blocks.forEach((block, idx) => {
      const lines = block.split('\n').map(l => l.trim()).filter(Boolean);
      let qNum = idx + 1;
      let qTextLines = [];
      let options = [];
      let isOptionsSection = false;

      lines.forEach(line => {
        const qMatch = line.match(/^Question\s+(\d+)[:.]?/i);
        if (qMatch) {
          qNum = parseInt(qMatch[1], 10);
          const rest = line.replace(/^Question\s+\d+[:.]?/i, '').trim();
          if (rest) qTextLines.push(rest);
          return;
        }

        if (/^Options\s*:/i.test(line)) {
          isOptionsSection = true;
          return;
        }

        const optMatch = line.match(/^(\d+|[A-Za-z])[.)]\s*(.+)/);
        if (optMatch) {
          isOptionsSection = true;
          options.push({
            optionNumber: optMatch[1],
            optionText: optMatch[2].trim()
          });
        } else if (!isOptionsSection) {
          qTextLines.push(line);
        }
      });

      if (qTextLines.length > 0 || options.length > 0) {
        parsedData.push({
          questionNumber: qNum,
          question: qTextLines.join(' '),
          options: options
        });
      }
    });

    return parsedData;
  }

  function saveParagraphToIndexedDB() {
    const rawText = document.getElementById('p1-import-paragraph').value.trim();
    if (!rawText) return alert('Please paste the paragraph text first.');

    const parsedItems = parseParagraphText(rawText);
    if (parsedItems.length === 0) return alert('Could not parse questions. Verify formatting.');

    const tx = db.transaction(STORE_NAME, "readwrite");
    const store = tx.objectStore(STORE_NAME);

    parsedItems.forEach(item => store.put(item));

    tx.oncomplete = () => {
      alert(`[SpeedUp] Saved ${parsedItems.length} questions to IndexedDB!`);
      document.getElementById('p1-import-paragraph').value = '';
      loadStoredQuestions();
    };
  }

  function loadStoredQuestions() {
    if (!db) return;
    const tx = db.transaction(STORE_NAME, "readonly");
    const store = tx.objectStore(STORE_NAME);
    const req = store.getAll();

    req.onsuccess = () => {
      const rows = req.result.sort((a, b) => a.questionNumber - b.questionNumber);
      const tbody = document.querySelector('#records-table tbody');
      if (rows.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--text-muted);">No records in database.</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map(r => `
        <tr>
          <td><strong style="color: var(--primary);">Q${r.questionNumber}</strong></td>
          <td>${escapeHtml(r.question || 'N/A')}</td>
          <td>
            ${r.options && r.options.length > 0 
              ? `<ol class="opt-list">${r.options.map(o => `<li>${escapeHtml(o.optionText)}</li>`).join('')}</ol>`
              : '<span style="color:var(--text-muted)">None</span>'}
          </td>
          <td><button style="padding: 4px 8px; font-size: 11px; cursor: pointer; background: #374151; border: 1px solid #4b5563; color:#fff; border-radius: 4px;" onclick="deleteRecord(${r.questionNumber})">Delete</button></td>
        </tr>
      `).join('');
    };
  }

  function deleteRecord(id) {
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).delete(id);
    tx.oncomplete = () => loadStoredQuestions();
  }

  function clearAllRecords() {
    if (!confirm("Clear all questions from SpeedUp database?")) return;
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).clear();
    tx.oncomplete = () => loadStoredQuestions();
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  /* ----------------------------------------------------
     PART 1: DEDUPLICATED SCRAPER SCRIPT GENERATOR
  ---------------------------------------------------- */
  function generatePart1Script() {
    const totalQ = document.getElementById('p1-total-q').value;
    const speed = document.getElementById('p1-speed').value;

    const script = `(async () => {
  const totalQuestions = ${totalQ};
  const waitTime = ${speed};
  const sleep = (ms) => new Promise(res => setTimeout(res, ms));
  const collected = [];

  function extract(idx) {
    const qEl = document.querySelector('.question-p pre p') ||
                document.querySelector('.question-p pre') ||
                document.querySelector('.question-p') ||
                document.querySelector('.question-col');

    // Strict non-overlapping option selector
    const labelElements = document.querySelectorAll('.options-container .mcq-option-label, .Answer-options .mcq-option-label');
    
    let opts = [];
    if (labelElements.length > 0) {
      opts = Array.from(labelElements).map((el, i) => {
        return {
          num: i + 1,
          text: el.innerText.trim().replace(/\\s+/g, ' ')
        };
      });
    } else {
      const radios = document.querySelectorAll('.options-container input[type="radio"], input.mcq-questions[type="radio"]');
      opts = Array.from(radios).map((radio, i) => {
        const linkedLabel = document.querySelector("label[for='" + radio.id + "']") || radio.closest('.form-check');
        return {
          num: i + 1,
          text: linkedLabel ? linkedLabel.innerText.trim().replace(/\\s+/g, ' ') : 'N/A'
        };
      });
    }

    return {
      num: idx,
      text: qEl ? qEl.innerText.trim() : 'N/A',
      options: opts
    };
  }

  console.clear();
  console.log("%c=======================================================", "color: #f59e0b; font-weight: bold;");
  console.log("%c        EXTRACTING ALL " + totalQuestions + " QUESTIONS & OPTIONS        ", "color: #f59e0b; font-weight: bold;");
  console.log("%c=======================================================", "color: #f59e0b; font-weight: bold;");

  for (let i = 1; i <= totalQuestions; i++) {
    const data = extract(i);
    collected.push(data);

    console.group("%c▶ QUESTION " + data.num + " of " + totalQuestions, "color: #a78bfa; font-weight: bold;");
    console.log("%c" + data.text, "color: #ffffff; font-weight: bold;");
    if (data.options.length > 0) {
      data.options.forEach((opt) => {
        console.log("  %c(" + opt.num + ") %c" + opt.text, "color: #f59e0b; font-weight: bold;", "color: #d1d5db;");
      });
    }
    console.groupEnd();

    if (i < totalQuestions) {
      const nextBtn = document.querySelector('button.save-next') || 
                      document.querySelector('.save-next') || 
                      [...document.querySelectorAll('button')].find(b => b.textContent.trim().toLowerCase().includes('next'));
      if (nextBtn) { 
        nextBtn.click(); 
        await sleep(waitTime); 
      }
    }
  }

  let fullSummary = "================== ALL " + totalQuestions + " QUESTIONS & OPTIONS ==================\\n\\n";
  collected.forEach(item => {
    fullSummary += "Question " + item.num + ":\\n" + item.text + "\\n\\nOptions:\\n";
    item.options.forEach(opt => {
      fullSummary += "  (" + opt.num + ") " + opt.text + "\\n";
    });
    fullSummary += "\\n----------------------------------------------------------------\\n\\n";
  });

  async function copyToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (err) {}
    }
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed";
    ta.style.left = "-999999px";
    document.body.appendChild(ta);
    ta.select();
    let success = false;
    try { success = document.execCommand('copy'); } catch (err) {}
    document.body.removeChild(ta);
    return success;
  }

  const isCopied = await copyToClipboard(fullSummary);
  console.log("%c=======================================================", "color: #10b981; font-weight: bold;");
  if (isCopied) {
    console.log("%c✓ SUCCESS: All " + totalQuestions + " questions copied to clipboard!", "color: #10b981; font-size: 14px; font-weight: bold;");
  }
  console.log("%c=======================================================", "color: #10b981; font-weight: bold;");
  console.log(fullSummary);
})();`;

    document.getElementById('p1-script-output').textContent = script;
  }

  /* ----------------------------------------------------
     PART 2: CALENDAR GRID & TARGET ARRAY SYNC
  ---------------------------------------------------- */
  const selectedQuestions = new Set([1, 3, 4, 5, 6, 7, 8, 9, 10, 12, 14, 15, 16, 17, 18, 19, 20, 22, 23]);
  const parsedAnswerMap = new Map();

  function updateTargetInputBox() {
    const sorted = Array.from(selectedQuestions).sort((a, b) => a - b);
    document.getElementById('p2-target-input').value = `[${sorted.join(', ')}]`;
  }

  function syncGridFromInput() {
    const rawVal = document.getElementById('p2-target-input').value;
    const cleanNumbers = rawVal.replace(/[\[\]]/g, '').split(',')
      .map(s => parseInt(s.trim(), 10))
      .filter(n => !isNaN(n));

    selectedQuestions.clear();
    cleanNumbers.forEach(n => selectedQuestions.add(n));
    
    renderCalendarGrid(false);
    generatePart2Script();
  }

  function renderCalendarGrid(syncInput = true) {
    const total = parseInt(document.getElementById('p2-total-q').value, 10) || 30;
    const grid = document.getElementById('p2-cal-grid');
    grid.innerHTML = '';
    
    for (let i = 1; i <= total; i++) {
      const btn = document.createElement('div');
      btn.className = 'cal-btn' + (selectedQuestions.has(i) ? ' active' : '');
      btn.textContent = i;
      btn.onclick = () => {
        if (selectedQuestions.has(i)) {
          selectedQuestions.delete(i);
          btn.classList.remove('active');
        } else {
          selectedQuestions.add(i);
          btn.classList.add('active');
        }
        updateTargetInputBox();
        generatePart2Script();
      };
      grid.appendChild(btn);
    }
    if (syncInput) {
      updateTargetInputBox();
    }
  }

  function autoSelectAllGrid(select) {
    const total = parseInt(document.getElementById('p2-total-q').value, 10) || 30;
    selectedQuestions.clear();
    if (select) {
      for (let i = 1; i <= total; i++) selectedQuestions.add(i);
    }
    renderCalendarGrid();
    generatePart2Script();
  }

  function autoSelectPreset(type) {
    const total = parseInt(document.getElementById('p2-total-q').value, 10) || 30;
    selectedQuestions.clear();

    if (type === 'answers') {
      handleAnswerInput(true);
      return;
    }

    renderCalendarGrid();
    generatePart2Script();
  }

  function handleAnswerInput(forceSyncTarget = false) {
    const rawText = document.getElementById('p2-answers').value.trim();
    parsedAnswerMap.clear();

    const pairRegex = /\[\s*(\d+)\s*,\s*(\d+)\s*\]/g;
    let match;
    let foundPairs = 0;

    while ((match = pairRegex.exec(rawText)) !== null) {
      const qNum = parseInt(match[1], 10);
      const ansNum = parseInt(match[2], 10);
      parsedAnswerMap.set(qNum, ansNum);
      foundPairs++;
    }

    if (foundPairs > 0) {
      if (forceSyncTarget || document.activeElement === document.getElementById('p2-answers')) {
        selectedQuestions.clear();
        for (const qNum of parsedAnswerMap.keys()) {
          selectedQuestions.add(qNum);
        }
        renderCalendarGrid(true);
      }
    } else {
      const flatList = rawText.replace(/[\[\]]/g, '').split(',')
        .map(s => parseInt(s.trim(), 10))
        .filter(n => !isNaN(n));

      const targetArr = Array.from(selectedQuestions).sort((a, b) => a - b);
      targetArr.forEach((qNum, idx) => {
        if (idx < flatList.length) {
          parsedAnswerMap.set(qNum, flatList[idx]);
        }
      });
    }

    generatePart2Script();
  }

  function generatePart2Script() {
    const total = parseInt(document.getElementById('p2-total-q').value, 10) || 30;
    const speed = document.getElementById('p2-speed').value || 50000;
    const targetArr = Array.from(selectedQuestions).sort((a, b) => a - b);

    const mapRows = [];
    let rowBuffer = [];
    
    targetArr.forEach((qNum) => {
      if (parsedAnswerMap.has(qNum)) {
        rowBuffer.push(`[${qNum}, ${parsedAnswerMap.get(qNum)}]`);
        if (rowBuffer.length === 5) {
          mapRows.push(rowBuffer.join(', '));
          rowBuffer = [];
        }
      }
    });
    if (rowBuffer.length > 0) {
      mapRows.push(rowBuffer.join(', '));
    }

    const mapCode = mapRows.length > 0 ? mapRows.join(',\n    ') : '// No target questions selected';

    const script = `(async () => {
  const answerMap = new Map([
    ${mapCode}
  ]);

  const totalQuestions = ${total};
  const waitSpeed = ${speed};
  const sleep = (ms) => new Promise((res) => setTimeout(res, ms));

  let answeredCount = 0;
  let skippedCount = 0;

  console.log("%c[Status] Processing started with " + (waitSpeed/1000) + "-second interval per question...", "color: #f59e0b; font-weight: bold;");

  for (let currentQ = 1; currentQ <= totalQuestions; currentQ++) {
    if (answerMap.has(currentQ)) {
      const targetAnswerNum = answerMap.get(currentQ);
      const targetIndex = targetAnswerNum - 1;

      const options = document.querySelectorAll(
        '.options-container input[type="radio"], input.mcq-questions[type="radio"], input[type="radio"]'
      );

      if (options.length > 0 && targetIndex >= 0 && targetIndex < options.length) {
        const targetOpt = options[targetIndex];

        targetOpt.checked = true;
        targetOpt.click();

        const label = document.querySelector("label[for='" + targetOpt.id + "']") || targetOpt.closest('.form-check');
        if (label) label.click();

        targetOpt.dispatchEvent(new Event('input', { bubbles: true }));
        targetOpt.dispatchEvent(new Event('change', { bubbles: true }));

        answeredCount++;
        console.log("%c[Done] Q" + currentQ + ": Option " + targetAnswerNum + " selected. Waiting " + (waitSpeed/1000) + "s...", "color: #10b981;");
      } else {
        console.warn("[Warning] Q" + currentQ + ": Option element not found.");
      }
    } else {
      skippedCount++;
      console.log("[Skip] Q" + currentQ + ": Not in target list. Waiting " + (waitSpeed/1000) + "s...");
    }

    await sleep(waitSpeed);

    const nextBtn =
      document.querySelector('button.save-next') ||
      document.querySelector('.save-next') ||
      [...document.querySelectorAll('button')].find((b) =>
        b.textContent.trim().toLowerCase().includes('next')
      );

    if (nextBtn && currentQ < totalQuestions) {
      nextBtn.click();
      await sleep(1200);
    }
  }

  console.group("%c=== TASK COMPLETED ===", "color: #10b981; font-size: 14px; font-weight: bold;");
  console.log("Total Questions Scanned : " + totalQuestions);
  console.log("Target Questions Answered: " + answeredCount);
  console.log("Questions Skipped        : " + skippedCount);
  console.log("Completion Status        : 100% Successful");
  console.groupEnd();
})();`;

    document.getElementById('p2-script-output').textContent = script;
  }

  window.onload = () => {
    initDB();
    renderCalendarGrid();
    generatePart1Script();
    handleAnswerInput(true);
  };
</script>
